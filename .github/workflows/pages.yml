name: Build icons & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow -q && python scripts/make_icon.py
      - name: Commit icons
        run: |
          git config user.name "kev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || git commit -m "Icônes PWA"
          git push
